<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proctoring sandbox (dev only)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap"
    />
    <script>
      // Match the app's pre-paint theme script so the CSS tokens resolve.
      try {
        var stored = localStorage.getItem("theme");
        document.documentElement.classList.add(stored === "dark" ? "dark" : "light");
      } catch (_) {
        document.documentElement.classList.add("light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/proctor-sandbox.tsx"></script>
  </body>
</html>
